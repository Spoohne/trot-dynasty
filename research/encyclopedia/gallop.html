const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = s => s[0].toUpperCase() + s.slice(1), money = v => "$" + Math.round(v || 0).toLocaleString();
const mt = t => t == null ? "–" : `${Math.floor(t / 60)}:${(t % 60).toFixed(2).padStart(5, "0")}`;
const chip = r => `<span class="g g${r}">${r}</span>`;
const pct = v => (100 * v).toFixed(1) + "%";
const m = D.meta;
$("#meta").textContent = `${m.season_done || 0} of ${m.seasons_planned} seasons · ${D.horses.length.toLocaleString()} horses · ${D.times.n.toLocaleString()} races at a mile${m.finished ? "" : " · still running"}`;
$("#lead").innerHTML = `Horses with ${D.min_starts}+ starts (${D.n_done.toLocaleString()}), ranked by career win rate. <b>Top</b> is the best tenth (win rate ${pct(D.group_wr.top)}), <b>middle</b> the tenth around the median (${pct(D.group_wr.middle)}), <b>bottom</b> the worst tenth (${pct(D.group_wr.bottom)}). Stats are the horse's own, before age.`;
const W = 90;
$("#means").innerHTML = `<tr><th>Stat</th><th>Top 10%</th><th>Middle</th><th>Bottom 10%</th><th>All</th><th>Top − bottom</th></tr>` + D.stats.map(k => {
  const d = D.means.top[k] - D.means.bottom[k];
  return `<tr><td>${cap(k)}</td><td>${D.means.top[k].toFixed(1)}</td><td>${D.means.middle[k].toFixed(1)}</td><td>${D.means.bottom[k].toFixed(1)}</td><td>${D.means.all[k].toFixed(1)}</td><td><i class="bar ${d < 0 ? "neg" : ""}" style="width:${Math.min(W, Math.abs(d) * 4)}px"></i> ${d > 0 ? "+" : ""}${d.toFixed(1)}</td></tr>`}).join("");
$("#corr").innerHTML = `<tr><th>Stat</th><th>Pearson r</th><th>Spearman</th><th>Fit ‰ / point</th></tr>` + D.stats.slice().sort((a, b) => D.corr[b].pearson - D.corr[a].pearson).map(k => {
  const c = D.corr[k];
  return `<tr><td>${cap(k)}</td><td><i class="bar ${c.pearson < 0 ? "neg" : ""}" style="width:${Math.abs(c.pearson) * W}px"></i> ${c.pearson.toFixed(2)}</td><td>${c.spearman.toFixed(2)}</td><td>${D.fit[k] > 0 ? "+" : ""}${D.fit[k].toFixed(2)}</td></tr>`}).join("");

$("#ranks").innerHTML = `<tr><th>Rank</th><th>Horses</th><th>Starts</th><th>Win %</th><th>Top 3 %</th><th>Avg purses</th><th>Fastest mile</th></tr>` + D.by_rank.map(r =>

const T = D.times;

const mx = Math.max(...T.hist.map(h => h[1]));

const SHOW = ["name", "rank", ...D.stats, "starts", "wins", "winpct", "earnings", "best"];
const val = (h, c) => c === "winpct" ? (h[I.starts] ? h[I.wins] / h[I.starts] : 0) : h[I[c]];
let sort = "wins", dir = -1, page = 0;
$("#rk").innerHTML += D.bands.map(b => `<option>${b[1]}</option>`).join("");
function list() {
  const q = $("#q").value.toLowerCase(), rk = $("#rk").value, done = $("#done").checked;
  let rows = D.horses.filter(h => (!q || h[I.name].toLowerCase().includes(q)) && (!rk || h[I.rank] === rk) && (!done || h[I.retired] != null));
  rows.sort((a, b) => { const x = val(a, sort), y = val(b, sort); return (x == null) - (y == null) || (x > y ? 1 : x < y ? -1 : 0) * dir; });
  const per = 50, np = Math.max(1, Math.ceil(rows.length / per)); page = Math.min(page, np - 1);
  $("#count").innerHTML = `<b>${rows.length.toLocaleString()}</b> horses`; $("#pg").textContent = `${page + 1} / ${np}`;
  $("#list").innerHTML = `<tr>${SHOW.map(c => `<th class="${c === sort ? "on" : ""}" data-c=${c}>${c === "winpct" ? "Win %" : c === "earnings" ? "Purses" : c === "best" ? "Best mile" : cap(c)}</th>`).join("")}</tr>` +
    rows.slice(page * per, page * per + per).map(h => `<tr class=h data-id=${h[I.id]}>${SHOW.map(c => c === "name" ? `<td>${esc(h[I.name])}</td>` : c === "rank" ? `<td>${chip(h[I.rank])}</td>` : c === "winpct" ? `<td>${pct(val(h, c))}</td>` : c === "earnings" ? `<td class=money>${money(h[I.earnings])}</td>` : c === "best" ? `<td>${mt(h[I.best])}</td>` : `<td>${h[I[c]] ?? "–"}</td>`).join("")}</tr>`).join("");
}
$("#list").onclick = e => { const th = e.target.closest("th"); if (th) { const c = th.dataset.c; dir = sort === c ? -dir : (c === "name" ? 1 : -1); sort = c; page = 0; return list(); }
  const tr = e.target.closest("tr.h"); if (tr) open(+tr.dataset.id); };
["q", "rk", "done"].forEach(id => $("#" + id).oninput = () => { page = 0; list(); });
$("#prev").onclick = () => { page = Math.max(0, page - 1); list(); }; $("#next").onclick = () => { page++; list(); };
function open(id) {
  const h = D.horses.find(x => x[I.id] === id), ss = D.seasons[id] || [];
  $("#drawer").innerHTML = `<button class=close onclick="shut()">×</button><div class=dh><h2>${esc(h[I.name])}</h2>${chip(h[I.rank])} <span class=count>${h[I.sex] === "f" ? "mare" : "horse"} · foaled season ${h[I.foaled]}${h[I.retired] != null ? ` · retired after season ${h[I.retired]}` : " · in training"}</span></div>
    <div class=stats>${D.stats.map(k => `<div><b>${h[I[k]]}</b><span>${k}</span></div>`).join("")}</div>
    <div class=stats><div><b>${h[I.starts]}</b><span>starts</span></div><div><b>${h[I.wins]}</b><span>wins</span></div><div><b>${h[I.places]}</b><span>top 3</span></div><div><b class=money>${money(h[I.earnings])}</b><span>purses</span></div><div><b>${mt(h[I.best])}</b><span>best mile</span></div></div>
    <div class=sec>Season by season</div><div class=tw><table><tr><th>Season</th><th>Age</th><th>Starts</th><th>Wins</th><th>Top 3</th><th>Purses</th><th>Best</th><th>Blocked</th></tr>${ss.map(s => `<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3]}</td><td>${s[4]}</td><td class=money>${money(s[5])}</td><td>${mt(s[6])}</td><td>${s[7].toFixed(0)} fr</td></tr>`).join("")}</table></div>`;
  $("#drawer").classList.add("on"); $("#shade").classList.add("on");
}
function shut() { $("#drawer").classList.remove("on"); $("#shade").classList.remove("on"); }
$("#shade").onclick = shut;
$("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b)); document.querySelectorAll("main section").forEach(s => s.classList.toggle("hidden", s.id !== "t-" + b.dataset.t)); };
list();
</script></body></html>
